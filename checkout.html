<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | FoodExpress</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #f7f8fa;
    color: #222;
}

/* NAVBAR */

.navbar {
    height: 72px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    color: #e23744;
    text-decoration: none;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 28px;
}

.nav-links a {
    text-decoration: none;
    color: #333;
    font-weight: 600;
}

.nav-links a:hover {
    color: #e23744;
}

.cart-btn {
    background: #e23744;
    color: white !important;
    padding: 10px 18px;
    border-radius: 22px;
}

/* PROFILE */

.profile-area {
    position: relative;
}

.profile-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #e23744;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    cursor: pointer;
}

.profile-dropdown {
    display: none;
    position: absolute;
    right: 0;
    top: 52px;
    width: 250px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    padding: 18px;
    z-index: 2000;
}

.profile-dropdown.show {
    display: block;
}

.profile-header {
    border-bottom: 1px solid #eee;
    padding-bottom: 14px;
    margin-bottom: 12px;
}

.profile-name {
    font-size: 17px;
    font-weight: 700;
}

.profile-email {
    color: #777;
    font-size: 13px;
    margin-top: 4px;
    word-break: break-word;
}

.profile-dropdown a,
.logout-btn {
    display: block;
    width: 100%;
    padding: 10px 8px;
    text-decoration: none;
    color: #333;
    border-radius: 8px;
    border: none;
    background: none;
    text-align: left;
    cursor: pointer;
}

.profile-dropdown a:hover,
.logout-btn:hover {
    background: #f7f7f7;
}

.logout-btn {
    color: #e23744;
    font-weight: 600;
}

/* HEADER */

.page-header {
    padding: 45px 6%;
    background: linear-gradient(135deg, #fff2f3, white);
}

.page-header h1 {
    font-size: 38px;
}

/* CHECKOUT */

.checkout-container {
    padding: 40px 6% 70px;
    display: grid;
    grid-template-columns: 1fr 350px;
    gap: 30px;
}

.checkout-card,
.summary-card {
    background: white;
    border-radius: 15px;
    padding: 25px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

.checkout-card h2,
.summary-card h2 {
    margin-bottom: 20px;
}

.address-card {
    background: #fff6f7;
    border: 1px solid #ffdadd;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 25px;
}

.address-card strong {
    font-size: 18px;
}

.address-card p {
    color: #555;
    line-height: 1.6;
    margin-top: 8px;
}

.edit-btn {
    margin-top: 12px;
    border: none;
    background: #e23744;
    color: white;
    padding: 9px 15px;
    border-radius: 7px;
    cursor: pointer;
}

.payment-option {
    border: 1px solid #ddd;
    padding: 15px;
    border-radius: 10px;
    margin: 12px 0;
    cursor: pointer;
}

.payment-option:hover {
    border-color: #e23744;
}

.payment-option input {
    margin-right: 10px;
}

.place-order-btn {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #e23744;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    margin: 13px 0;
}

.total {
    border-top: 1px solid #ddd;
    padding-top: 15px;
    margin-top: 15px;
    font-size: 20px;
    font-weight: 800;
}

.empty {
    text-align: center;
    padding: 60px 20px;
    background: white;
    border-radius: 15px;
}

.empty a {
    display: inline-block;
    margin-top: 20px;
    background: #e23744;
    color: white;
    text-decoration: none;
    padding: 12px 20px;
    border-radius: 8px;
}

footer {
    background: #181818;
    color: white;
    text-align: center;
    padding: 28px;
}

@media(max-width: 850px) {

    .checkout-container {
        grid-template-columns: 1fr;
    }

    .nav-links {
        gap: 12px;
    }

    .nav-links a:not(.cart-btn) {
        display: none;
    }
}

</style>
</head>

<body>

<nav class="navbar">

<a href="index.html" class="logo">FoodExpress</a>

<div class="nav-links">

<a href="index.html">Home</a>
<a href="restaurants.html">Restaurants</a>
<a href="orders.html">Orders</a>

<a href="cart.html" class="cart-btn">
Cart 🛒 <span id="cartCount">0</span>
</a>

<div class="profile-area">

<div
class="profile-avatar"
id="profileAvatar"
onclick="toggleProfileMenu()">
👤
</div>

<div class="profile-dropdown" id="profileDropdown">

<div class="profile-header">

<div class="profile-name" id="profileName">
Guest User
</div>

<div class="profile-email" id="profileEmail">
Login / Register
</div>

</div>

<a href="profile.html">👤 My Profile</a>
<a href="orders.html">📦 My Orders</a>

<button class="logout-btn" onclick="logoutUser()">
🚪 Logout
</button>

</div>

</div>

</div>

</nav>


<section class="page-header">

<h1>Checkout 💳</h1>

</section>


<div class="checkout-container">

<div class="checkout-card" id="checkoutContent">

<h2>Delivery Details</h2>

<div id="addressSection"></div>

<h2>Payment Method</h2>

<form id="checkoutForm">

<label class="payment-option">

<input
type="radio"
name="payment"
value="Cash on Delivery"
checked>

Cash on Delivery

</label>


<label class="payment-option">

<input
type="radio"
name="payment"
value="UPI">

UPI

</label>


<label class="payment-option">

<input
type="radio"
name="payment"
value="Credit/Debit Card">

Credit / Debit Card

</label>


<button
type="submit"
class="place-order-btn">

Place Order

</button>

</form>

</div>


<div class="summary-card">

<h2>Order Summary</h2>

<div class="summary-row">

<span>Subtotal</span>

<span id="subtotal">
₹0
</span>

</div>


<div class="summary-row">

<span>Delivery Fee</span>

<span id="deliveryFee">
₹0
</span>

</div>


<div class="summary-row">

<span>GST (5%)</span>

<span id="gst">
₹0
</span>

</div>


<div class="summary-row total">

<span>Total</span>

<span id="grandTotal">
₹0
</span>

</div>

</div>

</div>


<footer>
<p>© 2026 FoodExpress. Delicious food, delivered fast.</p>
</footer>


<script>

const cart =
JSON.parse(localStorage.getItem("foodExpressCart")) || [];


const savedUser =
JSON.parse(localStorage.getItem("foodExpressUser")) || null;


function updateCartCount() {

let count = 0;

cart.forEach(item => {

count += item.quantity || 1;

});

document.getElementById("cartCount").textContent =
count;

}


function calculateTotal() {

let subtotal = 0;

cart.forEach(item => {

subtotal +=
Number(item.price) *
(item.quantity || 1);

});


const delivery =
subtotal < 299 ? 40 : 0;

const gst =
Math.round(subtotal * 0.05);

const total =
subtotal + delivery + gst;


document.getElementById("subtotal").textContent =
"₹" + subtotal;

document.getElementById("deliveryFee").textContent =
"₹" + delivery;

document.getElementById("gst").textContent =
"₹" + gst;

document.getElementById("grandTotal").textContent =
"₹" + total;

return {
subtotal,
delivery,
gst,
total
};

}


function renderAddress() {

const section =
document.getElementById("addressSection");


if (!savedUser) {

section.innerHTML = `

<div class="address-card">

<strong>Profile Required</strong>

<p>
Please create your profile and save your
delivery address before placing an order.
</p>

<button
class="edit-btn"
onclick="window.location.href='profile.html'">

Create Profile

</button>

</div>

`;

document.getElementById("checkoutForm").style.display =
"none";

return;

}


section.innerHTML = `

<div class="address-card">

<strong>
${escapeHTML(savedUser.name)}
</strong>

<p>

${escapeHTML(savedUser.address || "Address not added")}<br>

${escapeHTML(savedUser.city || "")}
${savedUser.pincode ? " - " + escapeHTML(savedUser.pincode) : ""}

<br>

📞 ${escapeHTML(savedUser.phone || "Phone not added")}

<br>

✉️ ${escapeHTML(savedUser.email || "")}

</p>

<button
class="edit-btn"
onclick="window.location.href='profile.html'">

Edit Profile

</button>

</div>

`;

}


document
.getElementById("checkoutForm")
.addEventListener("submit", function(event) {

event.preventDefault();


if (cart.length === 0) {

alert("Your cart is empty.");

window.location.href = "restaurants.html";

return;

}


if (!savedUser) {

alert("Please create your profile first.");

window.location.href = "profile.html";

return;

}


const totals =
calculateTotal();


const paymentMethod =
document.querySelector(
'input[name="payment"]:checked'
).value;


const order = {

orderId:
"FE" + Date.now().toString().slice(-8),

restaurantName:
cart[0]?.restaurantName || "FoodExpress",

items:
cart,

customer: {

name:
savedUser.name,

phone:
savedUser.phone,

email:
savedUser.email,

address:
savedUser.address,

city:
savedUser.city,

pincode:
savedUser.pincode

},

paymentMethod:

paymentMethod,

subtotal:
totals.subtotal,

deliveryFee:
totals.delivery,

gst:
totals.gst,

total:
totals.total,

status:
"Order Placed",

statusStep:
0,

placedAt:
Date.now(),

date:
new Date().toLocaleString()

};


const orders =
JSON.parse(
localStorage.getItem("foodExpressOrders")
) || [];


orders.push(order);


localStorage.setItem(
"foodExpressOrders",
JSON.stringify(orders)
);


localStorage.removeItem("foodExpressCart");


alert(
"Order placed successfully!\nOrder ID: " +
order.orderId
);


window.location.href =
"orders.html";

});


function escapeHTML(value) {

return String(value)
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");

}


/* PROFILE */

function getInitials(name) {

if (!name) return "👤";

const words =
name.trim().split(/\s+/);

if (words.length === 1) {

return words[0]
.substring(0, 2)
.toUpperCase();

}

return (
words[0][0] +
words[words.length - 1][0]
).toUpperCase();

}


function loadProfileNavbar() {

const userData =
localStorage.getItem("foodExpressUser");

const avatar =
document.getElementById("profileAvatar");

const name =
document.getElementById("profileName");

const email =
document.getElementById("profileEmail");


if (userData) {

const user =
JSON.parse(userData);

avatar.textContent =
getInitials(user.name);

name.textContent =
user.name || "User";

email.textContent =
user.email || "";

} else {

avatar.textContent = "👤";

name.textContent =
"Guest User";

email.textContent =
"Login / Register";

}

}


function toggleProfileMenu() {

document
.getElementById("profileDropdown")
.classList.toggle("show");

}


document.addEventListener("click", function(event) {

const area =
document.querySelector(".profile-area");

if (!area.contains(event.target)) {

document
.getElementById("profileDropdown")
.classList.remove("show");

}

});


function logoutUser() {

localStorage.removeItem("foodExpressUser");

alert("You have been logged out.");

window.location.href = "index.html";

}


if (cart.length === 0) {

document.getElementById("checkoutContent").innerHTML = `

<div class="empty">

<h2>Your cart is empty 🛒</h2>

<p>Add food before proceeding to checkout.</p>

<a href="restaurants.html">
Explore Restaurants
</a>

</div>

`;

} else {

renderAddress();

calculateTotal();

}


updateCartCount();
loadProfileNavbar();

</script>

</body>
</html>
