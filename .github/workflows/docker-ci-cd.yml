name: FoodExpress Docker CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate application files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f Dockerfile
          test -f compose.yaml
          echo "Application files validation passed."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          tags: foodexpress-app:ci
          load: true

      - name: Run container for testing
        run: |
          docker run -d --name foodexpress-test -p 8080:80 foodexpress-app:ci
          sleep 5
          curl --fail http://localhost:8080/

      - name: Stop test container
        if: always()
        run: |
          docker stop foodexpress-test || true
          docker rm foodexpress-test || true

      - name: Validate Docker Compose
        run: docker compose config

      - name: Test Docker Compose deployment
        run: |
          docker compose up -d --build
          sleep 5
          curl --fail http://localhost:8080/
          docker compose ps

      - name: Stop Docker Compose deployment
        if: always()
        run: docker compose down