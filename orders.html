<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders - FoodExpress</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f7f7f7;
            color: #222;
        }


        /* ================= NAVBAR ================= */

        nav {
            height: 68px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            text-decoration: none;
            font-size: 22px;
            font-weight: 800;
            color: #ff5a1f;
        }

        .logo span {
            color: #222;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-size: 14px;
            font-weight: 600;
        }

        .orders-active {
            background: #ff5a1f;
            color: white !important;
            padding: 10px 17px;
            border-radius: 7px;
        }

        .cart-btn {
            background: #222;
            color: white !important;
            padding: 10px 17px;
            border-radius: 7px;
        }


        /* ================= MAIN ================= */

        .container {
            width: 86%;
            max-width: 1500px;
            margin: auto;
            padding: 25px 0 60px;
        }

        .continue {
            display: inline-block;
            color: #ff5a1f;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .page-heading {
            margin-bottom: 25px;
        }

        .page-heading h1 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .page-heading p {
            color: #777;
            font-size: 14px;
        }


        /* ================= SECTION ================= */

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 25px 0 15px;
        }

        .section-header h2 {
            font-size: 21px;
        }

        .count {
            background: #fff0e8;
            color: #ff5a1f;
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }


        /* ================= ORDER CARD ================= */

        .order-card {
            background: white;
            border-radius: 13px;
            margin-bottom: 20px;
            border: 1px solid #e9e9e9;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.04);
        }

        .order-top {
            padding: 18px 22px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid #eee;
        }

        .order-id {
            color: #888;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .restaurant-name {
            font-size: 17px;
            font-weight: 700;
        }

        .status-badge {
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .active-badge {
            background: #fff0e8;
            color: #ff5a1f;
        }

        .delivered-badge {
            background: #e8f8ee;
            color: #168a45;
        }


        /* ================= ITEMS ================= */

        .order-items {
            padding: 5px 22px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            padding: 13px 0;
            border-bottom: 1px solid #f1f1f1;
            font-size: 13px;
        }

        .item-left {
            display: flex;
            gap: 7px;
        }

        .item-price {
            font-weight: 600;
        }


        /* ================= ORDER INFO ================= */

        .order-info {
            padding: 15px 22px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
        }

        .order-date {
            color: #777;
            font-size: 12px;
        }

        .order-total {
            font-size: 15px;
            font-weight: 700;
        }


        /* ================= TRACKING ================= */

        .tracking {
            padding: 22px;
        }

        .tracking-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .tracking-line {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            position: relative;
        }

        .tracking-line::before {
            content: "";
            position: absolute;
            height: 3px;
            background: #ddd;
            left: 8%;
            right: 8%;
            top: 15px;
            z-index: 0;
        }

        .progress-line {
            position: absolute;
            height: 3px;
            background: #22a653;
            left: 8%;
            top: 15px;
            z-index: 1;
            transition: width 0.5s ease;
        }

        .tracking-step {
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .step-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ddd;
            color: #777;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-size: 12px;
            font-weight: 700;
            transition: 0.4s;
        }

        .tracking-step.active .step-circle {
            background: #22a653;
            color: white;
        }

        .step-label {
            font-size: 10px;
            margin-top: 8px;
            color: #999;
            font-weight: 600;
        }

        .tracking-step.active .step-label {
            color: #168a45;
        }


        /* ================= MESSAGE ================= */

        .delivery-message {
            margin: 0 22px 22px;
            padding: 13px 16px;
            background: #fff8e8;
            border: 1px solid #f3df9d;
            color: #946d00;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
        }

        .delivery-message.done {
            background: #f0faf4;
            border-color: #c9edd7;
            color: #168a45;
        }


        /* ================= EMPTY ================= */

        .empty {
            background: white;
            padding: 45px 20px;
            text-align: center;
            border-radius: 13px;
            border: 1px solid #eee;
            margin-bottom: 20px;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        .empty p {
            color: #777;
            margin: 8px 0 18px;
            font-size: 14px;
        }

        .order-btn {
            display: inline-block;
            background: #ff5a1f;
            color: white;
            text-decoration: none;
            padding: 11px 20px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 13px;
        }


        /* ================= FOOTER ================= */

        footer {
            background: #181818;
            color: white;
            padding: 35px 7%;
            text-align: center;
        }

        footer .footer-logo {
            color: #ff5a1f;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        footer p {
            color: #999;
            font-size: 13px;
        }


        /* ================= MOBILE ================= */

        @media(max-width:700px) {

            nav {
                padding: 0 4%;
            }

            .nav-links {
                gap: 8px;
            }

            .nav-links a:not(.orders-active):not(.cart-btn) {
                display: none;
            }

            .container {
                width: 92%;
            }

            .order-top {
                flex-direction: column;
                gap: 12px;
            }

            .order-info {
                flex-direction: column;
                gap: 8px;
            }

            .step-label {
                font-size: 8px;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav>

        <a href="index.html" class="logo">
            🍔 Food<span>Express</span>
        </a>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="restaurants.html">
                Restaurants
            </a>

            <a href="orders.html" class="orders-active">
                📦 Orders
            </a>

            <a href="cart.html" class="cart-btn">
                🛒 Cart
                <span id="cartCount">0</span>
            </a>

        </div>

    </nav>


    <!-- ================= MAIN ================= -->

    <main class="container">


        <a
            href="restaurants.html"
            class="continue">

            ← Continue Ordering

        </a>


        <div class="page-heading">

            <h1>
                📦 My Orders
            </h1>

            <p>
                Track your current order and view your order history.
            </p>

        </div>


        <!-- ACTIVE ORDERS -->

        <div class="section-header">

            <h2>
                🚴 Active Orders
            </h2>

            <span
                class="count"
                id="activeCount">

                0 Active

            </span>

        </div>


        <div id="activeOrders"></div>


        <!-- HISTORY -->

        <div class="section-header">

            <h2>
                🕘 Order History
            </h2>

            <span
                class="count"
                id="historyCount">

                0 Orders

            </span>

        </div>


        <div id="historyOrders"></div>


    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="footer-logo">
            🍔 FoodExpress
        </div>

        <p>
            Fast, fresh and convenient food delivery.
        </p>

        <p style="margin-top:10px;">
            © 2026 FoodExpress. All Rights Reserved.
        </p>

    </footer>


    <script>


        /* =====================================================
           CART COUNT
        ===================================================== */

        function updateCartCount() {

            const cart =
                JSON.parse(
                    localStorage.getItem("foodExpressCart")
                ) || [];

            let count = 0;

            cart.forEach(item => {

                count += Number(item.quantity) || 1;

            });

            document.getElementById("cartCount").textContent =
                count;

        }


        /* =====================================================
           GET ORDERS
        ===================================================== */

        function getOrders() {

            return JSON.parse(
                localStorage.getItem("foodExpressOrders")
            ) || [];

        }


        /* =====================================================
           SAVE ORDERS
        ===================================================== */

        function saveOrders(orders) {

            localStorage.setItem(
                "foodExpressOrders",
                JSON.stringify(orders)
            );

        }


        /* =====================================================
           CALCULATE STATUS

           0 - Order Placed
           1 - Preparing
           2 - Out for Delivery
           3 - Delivered

           Every 60 seconds next stage.
        ===================================================== */

        function getStatusStep(order) {

            if (!order.placedAt) {

                return 3;

            }


            const elapsed =
                Date.now() - Number(order.placedAt);


            const minutes =
                Math.floor(
                    elapsed / 60000
                );


            if (minutes >= 3) {

                return 3;

            }

            if (minutes >= 2) {

                return 2;

            }

            if (minutes >= 1) {

                return 1;

            }

            return 0;

        }


        /* =====================================================
           STATUS TEXT
        ===================================================== */

        function getStatusText(step) {

            const statuses = [

                "Order Placed",
                "Preparing",
                "Out for Delivery",
                "Delivered"

            ];

            return statuses[step];

        }


        /* =====================================================
           ORDER CARD
        ===================================================== */

        function createOrderCard(order, step, isHistory) {


            let itemsHTML = "";


            if (order.items) {

                order.items.forEach(item => {

                    const quantity =
                        Number(item.quantity) || 1;

                    const price =
                        Number(item.price) || 0;

                    itemsHTML += `

                        <div class="item-row">

                            <div class="item-left">

                                <span>
                                    ${item.icon || "🍴"}
                                </span>

                                <span>
                                    ${item.name}
                                    × ${quantity}
                                </span>

                            </div>

                            <span class="item-price">

                                ₹${price * quantity}

                            </span>

                        </div>

                    `;

                });

            }


            const labels = [

                "Order Placed",
                "Preparing",
                "Out for Delivery",
                "Delivered"

            ];


            let stepsHTML = "";


            labels.forEach((label, index) => {

                const active =
                    index <= step
                    ? "active"
                    : "";


                stepsHTML += `

                    <div class="tracking-step ${active}">

                        <div class="step-circle">

                            ${
                                index <= step
                                ? "✓"
                                : index + 1
                            }

                        </div>

                        <div class="step-label">

                            ${label}

                        </div>

                    </div>

                `;

            });


            const progressWidth =
                step === 0
                ? "0%"
                : step === 1
                ? "28%"
                : step === 2
                ? "60%"
                : "84%";


            const message =
                step === 0
                ? "Your order has been placed successfully."
                : step === 1
                ? "Your food is being prepared."
                : step === 2
                ? "Your order is out for delivery."
                : "✓ Your order has been delivered successfully.";


            return `

                <div class="order-card">


                    <!-- TOP -->

                    <div class="order-top">

                        <div>

                            <div class="order-id">

                                Order ID:
                                ${order.orderId}

                            </div>

                            <div class="restaurant-name">

                                🏪
                                ${order.restaurantName}

                            </div>

                        </div>


                        <div
                            class="status-badge
                            ${
                                isHistory
                                ? "delivered-badge"
                                : "active-badge"
                            }">

                            ${
                                isHistory
                                ? "✓ Delivered"
                                : getStatusText(step)
                            }

                        </div>

                    </div>


                    <!-- ITEMS -->

                    <div class="order-items">

                        ${itemsHTML}

                    </div>


                    <!-- INFO -->

                    <div class="order-info">

                        <div class="order-date">

                            🕐 ${order.date}

                        </div>

                        <div class="order-total">

                            Total: ₹${order.total}

                        </div>

                    </div>


                    <!-- TRACKING -->

                    <div class="tracking">

                        <div class="tracking-title">

                            📍 Order Tracking

                        </div>


                        <div class="tracking-line">

                            <div
                                class="progress-line"
                                style="width:${progressWidth};">
                            </div>

                            ${stepsHTML}

                        </div>

                    </div>


                    <!-- MESSAGE -->

                    <div
                        class="
                            delivery-message
                            ${isHistory ? "done" : ""}
                        ">

                        ${message}

                    </div>


                </div>

            `;

        }


        /* =====================================================
           RENDER ORDERS
        ===================================================== */

        function renderOrders() {

            let orders = getOrders();


            const activeContainer =
                document.getElementById("activeOrders");

            const historyContainer =
                document.getElementById("historyOrders");


            let activeHTML = "";

            let historyHTML = "";


            let activeOrders = [];

            let historyOrders = [];


            /* =================================================
               CHECK EVERY ORDER
            ================================================= */

            orders.forEach(order => {


                /* Old orders without timer */

                if (!order.placedAt) {

                    order.status =
                        "Delivered";

                    order.statusStep =
                        3;

                    historyOrders.push(order);

                    return;

                }


                const step =
                    getStatusStep(order);


                /* ================= DELIVERED ================= */

                if (step >= 3) {

                    order.status =
                        "Delivered";

                    order.statusStep =
                        3;

                    historyOrders.push(order);

                }

                /* ================= ACTIVE ================= */

                else {

                    order.status =
                        getStatusText(step);

                    order.statusStep =
                        step;

                    activeOrders.push(order);

                }

            });


            /* =================================================
               SAVE UPDATED STATUS
            ================================================= */

            saveOrders(orders);


            /* =================================================
               ACTIVE ORDERS
            ================================================= */

            activeOrders
                .slice()
                .reverse()
                .forEach(order => {

                    activeHTML +=
                        createOrderCard(
                            order,
                            getStatusStep(order),
                            false
                        );

                });


            if (activeOrders.length === 0) {

                activeHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            🍽️
                        </div>

                        <h3>
                            No Active Orders
                        </h3>

                        <p>
                            Your new orders will appear here.
                        </p>

                        <a
                            href="restaurants.html"
                            class="order-btn">

                            Start Ordering

                        </a>

                    </div>

                `;

            }


            /* =================================================
               HISTORY
            ================================================= */

            historyOrders
                .slice()
                .reverse()
                .forEach(order => {

                    historyHTML +=
                        createOrderCard(
                            order,
                            3,
                            true
                        );

                });


            if (historyOrders.length === 0) {

                historyHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            🕘
                        </div>

                        <h3>
                            No Order History
                        </h3>

                        <p>
                            Completed orders will appear here.
                        </p>

                    </div>

                `;

            }


            activeContainer.innerHTML =
                activeHTML;

            historyContainer.innerHTML =
                historyHTML;


            document.getElementById(
                "activeCount"
            ).textContent =
                activeOrders.length +
                (
                    activeOrders.length === 1
                    ? " Active"
                    : " Active Orders"
                );


            document.getElementById(
                "historyCount"
            ).textContent =
                historyOrders.length +
                (
                    historyOrders.length === 1
                    ? " Order"
                    : " Orders"
                );

        }


        /* =====================================================
           START REAL-TIME TIMER
        ===================================================== */

        function startTracking() {

            renderOrders();


            /*
                Check every second.

                This makes the UI notice the exact
                minute transition without requiring
                a manual page refresh.
            */

            setInterval(function() {

                renderOrders();

            }, 1000);

        }


        /* =====================================================
           INITIALIZE
        ===================================================== */

        updateCartCount();

        startTracking();


    </script>

</body>

</html>
